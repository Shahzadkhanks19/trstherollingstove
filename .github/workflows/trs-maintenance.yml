name: TRS dependency and format maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trs-maintenance.yml"

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trs-app/package-lock.json
      - name: Install and refresh lockfile
        run: npm install
      - name: Format all supported files
        run: npm run format
      - name: Verify project
        run: npm run check
      - name: Commit generated maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: refresh lockfile and format project"
            git push
          fi
